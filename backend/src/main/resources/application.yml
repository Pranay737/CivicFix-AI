server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

spring:
  application:
    name: civicfix-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${DB_URL:jdbc:h2:mem:civicfixdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/{vendor}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

app:
  jwt:
    secret: ${JWT_SECRET:civicfix_ai_jwt_secret_key_needs_to_be_at_least_256_bits_length_for_hmac_sha_signing_ok}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000} # 1 hour
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  storage:
    type: ${STORAGE_TYPE:auto} # auto, cloudinary, local
    local-dir: ${LOCAL_STORAGE_DIR:./uploads}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      chat-model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
      embedding-model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}
    rules:
      duplicate-radius-meters: ${DUPLICATE_RADIUS_METERS:200.0}
      duplicate-similarity-threshold: ${DUPLICATE_SIMILARITY_THRESHOLD:0.80}
      duplicate-lookback-days: ${DUPLICATE_LOOKBACK_DAYS:30}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.civicfix: DEBUG
    org.springframework.security: INFO
