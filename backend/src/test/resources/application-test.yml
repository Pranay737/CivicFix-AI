spring:
  datasource:
    url: jdbc:h2:mem:civicfixtestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/h2

app:
  jwt:
    secret: civicfix_test_secret_key_at_least_256_bits_long_for_hmac_sha256_testing_civicfix
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
  cors:
    allowed-origins: http://localhost:5173
